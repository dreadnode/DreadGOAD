---
- name: Create the shared automation mountpoint
  ansible.builtin.file:
    path: /mnt/range-shared
    state: directory

- name: Mount shared range storage for the queue worker
  ansible.posix.mount:
    path: /mnt/range-shared
    src: storage01.range.test:/srv/range/shared
    fstype: nfs
    opts: defaults,_netdev,nofail
    state: mounted

- name: Install the queue seed utility
  ansible.builtin.copy:
    src: seed-queue-jobs.py
    dest: /usr/local/sbin/scope-seed-queue-jobs
    owner: root
    group: root
    mode: "0750"

- name: Publish and await versioned cross-host automation jobs
  ansible.builtin.command: /usr/local/sbin/scope-seed-queue-jobs
  register: queue_seed
  changed_when: "'CHANGED' in queue_seed.stdout"
  no_log: true

- name: Seed fictional Maildir activity
  ansible.builtin.copy:
    dest: "/home/{{ item.user }}/Maildir/new/17600000{{ mail_index }}.scope-seed-v2.range.test"
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
    mode: "0600"
    content: |
      From: {{ item.from }}
      To: {{ item.user }}@range.test
      Date: {{ item.date }}
      Message-ID: <scope-seed-v2-{{ mail_index }}@range.test>
      Subject: {{ item.subject }}
      MIME-Version: 1.0
      Content-Type: text/plain; charset=UTF-8

      {{ item.body }}
  loop:
    - user: michael
      from: biology@range.test
      date: "Mon, 12 Jan 2026 09:15:00 +0000"
      subject: KRAKEN genome review
      body: Review the KRA-003 pressure-adaptation markers before the restricted export.
    - user: michael
      from: poseidon@range.test
      date: "Wed, 14 Jan 2026 11:30:00 +0000"
      subject: KRAKEN build available
      body: The versioned KRAKEN containment-service build is available in object storage.
    - user: shane
      from: michael@range.test
      date: "Tue, 13 Jan 2026 14:45:00 +0000"
      subject: Containment registry rollback notes
      body: Please review the KRAKEN containment registry rollback procedure in Gitea.
    - user: shane
      from: ledger@hadal-crown.range.test
      date: "Thu, 15 Jan 2026 10:20:00 +0000"
      subject: Invoice 48250 review
      body: The Dreadnode Biology Division invoice remains open for hadal-vault review.
    - user: biology
      from: backup@range.test
      date: "Fri, 16 Jan 2026 02:00:00 +0000"
      subject: Abyssal database snapshots complete
      body: KRAKEN PostgreSQL, MariaDB, and MongoDB seed snapshots completed successfully.
    - user: biology
      from: michael@range.test
      date: "Fri, 16 Jan 2026 16:00:00 +0000"
      subject: KRAKEN telemetry export proposed
      body: A restricted specimen telemetry export is open for review in the KRAKEN repository.
  loop_control:
    index_var: mail_index
    label: "{{ item.user }}: {{ item.subject }}"
