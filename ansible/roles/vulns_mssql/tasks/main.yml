- name: Locate sqlcmd binary
  ansible.windows.win_shell: |
    $candidates = @(
      "C:\Program Files\Microsoft SQL Server\Client SDK\ODBC\170\Tools\Binn\SQLCMD.EXE",
      "C:\Program Files\Microsoft SQL Server\Client SDK\ODBC\180\Tools\Binn\SQLCMD.EXE"
    )
    foreach ($p in $candidates) {
      if (Test-Path $p) { Write-Output $p; exit 0 }
    }
    $found = Get-Command sqlcmd -ErrorAction SilentlyContinue
    if ($found) { Write-Output $found.Source; exit 0 }
    Write-Error "sqlcmd not found"; exit 1
  register: sqlcmd_lookup
  changed_when: false

- name: Set sqlcmd path fact
  ansible.builtin.set_fact:
    sqlcmd_exe: "{{ sqlcmd_lookup.stdout | trim }}"

- name: Run SQL COMMAND
  ansible.windows.win_shell: |
    & "{{ sqlcmd_exe }}" -E {{ item.value.cmd }}
  with_dict: "{{ vulns_vars }}"
