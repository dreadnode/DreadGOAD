---
# MSSQL Configuration Tasks
# These tasks configure SQL Server after installation
# They should ALWAYS run to ensure proper configuration (idempotent)
#
# The configuration identity needs an explicit SQL sysadmin login.
# BUILTIN\Administrators alone is not sufficient because UAC can filter
# the local Administrators SID from remote-management logon tokens.
#
# The bootstrap task tries Windows auth first, then falls back to sa
# auth (available after the first provision) so that re-runs work even
# if the connection identity's SQL login was previously dropped.
#
# The connection identity's SQL sysadmin is intentionally kept across runs
# so that re-provisioning remains idempotent without a bootstrap problem.

- name: Locate sqlcmd binary
  ansible.windows.win_shell: |
    $candidates = @(
      "C:\Program Files\Microsoft SQL Server\Client SDK\ODBC\170\Tools\Binn\SQLCMD.EXE",
      "C:\Program Files\Microsoft SQL Server\Client SDK\ODBC\180\Tools\Binn\SQLCMD.EXE"
    )
    foreach ($p in $candidates) {
      if (Test-Path $p) { Write-Output $p; exit 0 }
    }
    $found = Get-Command sqlcmd -ErrorAction SilentlyContinue
    if ($found) { Write-Output $found.Source; exit 0 }
    Write-Error "sqlcmd not found"; exit 1
  register: sqlcmd_lookup
  changed_when: false

- name: Set sqlcmd path fact
  ansible.builtin.set_fact:
    sqlcmd_exe: "{{ sqlcmd_lookup.stdout | trim }}"

- name: Ensure SQL configuration identity has sysadmin
  ansible.windows.win_shell: |
    # sqlcmd failures are expected while probing bootstrap paths, so inspect
    # LASTEXITCODE explicitly instead of letting native stderr terminate early.
    $ErrorActionPreference = "Continue"
    $sqlcmd = "{{ sqlcmd_exe }}"
    $instanceName = "{{ sql_instance_name }}"
    # Named-instance service names contain a literal dollar sign
    # (for example MSSQL$SQLEXPRESS), so prevent PowerShell interpolation.
    $serviceName = '{{ mssql_service_name }}'
    $saPassword = [Text.Encoding]::UTF8.GetString(
      [Convert]::FromBase64String("{{ sa_password | b64encode }}")
    )
    $saPasswordSql = $saPassword.Replace("'", "''")
    $currentIdentity = [Security.Principal.WindowsIdentity]::GetCurrent().Name
    $identityLiteral = "N'" + $currentIdentity.Replace("'", "''") + "'"
    $identityIdentifier = "[" + $currentIdentity.Replace("]", "]]") + "]"

    # Build multiline SQL from an array. PowerShell here-string terminators must
    # start in column zero, which is unsafe inside an indented YAML block scalar.
    $grantIdentityQuery = @(
      "IF NOT EXISTS (SELECT 1 FROM sys.server_principals WHERE name = $identityLiteral)"
      "  CREATE LOGIN $identityIdentifier FROM WINDOWS WITH DEFAULT_DATABASE=[master];"
      "IF NOT EXISTS ("
      "  SELECT 1"
      "  FROM sys.server_role_members srm"
      "  JOIN sys.server_principals r ON srm.role_principal_id = r.principal_id"
      "  JOIN sys.server_principals m ON srm.member_principal_id = m.principal_id"
      "  WHERE r.name = N'sysadmin' AND m.name = $identityLiteral"
      ")"
      "  ALTER SERVER ROLE [sysadmin] ADD MEMBER $identityIdentifier;"
    ) -join [Environment]::NewLine
    $sysadminCheckQuery = "SET NOCOUNT ON; " +
      "SELECT CASE WHEN IS_SRVROLEMEMBER('sysadmin')=1 " +
      "THEN 'HAS_SYSADMIN' ELSE 'NO_SYSADMIN' END"

    # Test if current session already has SQL sysadmin via Windows auth
    $test = & $sqlcmd {{ connection_type }} -Q $sysadminCheckQuery 2>&1
    $hasSysadmin = ($LASTEXITCODE -eq 0) -and ($test -match 'HAS_SYSADMIN')

    if (-not $hasSysadmin) {
      # Try sa auth first (available after prior provision or if SECURITYMODE=SQL was used at install)
      $saArgs = @("-b", "-U", "sa", "-P", $saPassword, "-S", "localhost\$instanceName")
      $r1 = & $sqlcmd @saArgs -Q "SELECT 1" 2>&1
      $saWorks = ($LASTEXITCODE -eq 0)

      if (-not $saWorks) {
        # Neither Windows auth nor sa auth works - bootstrap via single-user mode
        Write-Output "Bootstrapping SQL Server via single-user mode..."
        $service = Get-CimInstance Win32_Service -Filter "Name='$serviceName'"
        if (-not $service) { throw "SQL Server service not found: $serviceName" }
        $pathMatch = [regex]::Match($service.PathName, '^\s*(?:"([^"]+)"|(.+?\.exe))', 'IgnoreCase')
        if (-not $pathMatch.Success) { throw "Cannot parse sqlservr.exe path from: $($service.PathName)" }
        $sqlServerExe = if ($pathMatch.Groups[1].Success) { $pathMatch.Groups[1].Value } else { $pathMatch.Groups[2].Value }

        $proc = $null
        try {
          Stop-Service $serviceName -Force -ErrorAction Stop
          Start-Sleep -Seconds 3
          $proc = Start-Process -FilePath $sqlServerExe -ArgumentList "-s$instanceName", "-mSQLCMD" -PassThru -WindowStyle Hidden -ErrorAction Stop

          $ready = $false
          for ($attempt = 1; $attempt -le 20; $attempt++) {
            Start-Sleep -Seconds 2
            $probe = & $sqlcmd -b -E -S "localhost\$instanceName" -Q "SELECT 1" 2>&1
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
          }
          if (-not $ready) { throw "SQL Server single-user mode did not become ready: $probe" }

          $bootstrapQuery = @(
            "EXEC xp_instance_regwrite N'HKEY_LOCAL_MACHINE', N'Software\Microsoft\MSSQLServer\MSSQLServer', N'LoginMode', REG_DWORD, 2;"
            "ALTER LOGIN sa ENABLE;"
            "ALTER LOGIN sa WITH PASSWORD = N'$saPasswordSql', CHECK_POLICY=OFF;"
            $grantIdentityQuery
            "CHECKPOINT;"
          ) -join [Environment]::NewLine
          $bootstrap = & $sqlcmd -b -E -S "localhost\$instanceName" -Q $bootstrapQuery 2>&1
          if ($LASTEXITCODE -ne 0) { throw "SQL single-user bootstrap failed: $bootstrap" }
        }
        finally {
          if ($proc -and -not $proc.HasExited) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            $proc.WaitForExit(15000)
          }
          Start-Service $serviceName -ErrorAction SilentlyContinue
        }
        Write-Output "SQL Server bootstrapped via single-user mode for $currentIdentity"
      } else {
        # sa auth works - grant the exact Windows identity used by Ansible.
        $grant = & $sqlcmd @saArgs -Q $grantIdentityQuery 2>&1
        if ($LASTEXITCODE -ne 0) { throw "Granting SQL sysadmin to $currentIdentity failed: $grant" }
        Write-Output "SQL sysadmin bootstrapped via sa auth for $currentIdentity"
      }
    } else {
      Write-Output "SQL sysadmin access already available via Windows auth"
    }

    # Do not let a bootstrap path claim success unless the same Windows auth
    # used by every following task now resolves to an explicit sysadmin login.
    $verified = $false
    for ($attempt = 1; $attempt -le 20; $attempt++) {
      $verify = & $sqlcmd {{ connection_type }} -Q $sysadminCheckQuery 2>&1
      if (($LASTEXITCODE -eq 0) -and ($verify -match 'HAS_SYSADMIN')) {
        $verified = $true
        break
      }
      Start-Sleep -Seconds 2
    }
    if (-not $verified) { throw "SQL sysadmin verification failed for ${currentIdentity}: $verify" }
  no_log: true

- name: Add MSSQL admin
  ansible.windows.win_shell: |
    $ErrorActionPreference = "Continue"
    $sqlcmd = "{{ sqlcmd_exe }}"

    # Fast path: check if login already exists (no AD lookup needed).
    $check = & $sqlcmd {{ connection_type }} -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.server_principals WHERE name = '{{ item }}'" 2>&1
    $exists = ($LASTEXITCODE -eq 0) -and ($check -match '^\s*1\s*$')

    if (-not $exists) {
      # Retry CREATE LOGIN FROM WINDOWS to handle AD replication lag.
      # Keep total wall-clock under 40s to survive SSM session drops.
      $loginCreated = $false
      $maxAttempts = 6
      for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
        $result1 = & $sqlcmd {{ connection_type }} -Q "IF NOT EXISTS (SELECT * FROM sys.server_principals WHERE name = '{{ item }}') CREATE LOGIN [{{ item }}] FROM WINDOWS" 2>&1
        if ($LASTEXITCODE -eq 0) {
          $loginCreated = $true
          break
        }
        if ($attempt -eq $maxAttempts) {
          Write-Error "CREATE LOGIN failed after $maxAttempts attempts: $result1"
          exit 1
        }
        Write-Output "CREATE LOGIN attempt $attempt failed (AD replication lag?), retrying in 5s..."
        Start-Sleep -Seconds 5
      }
    } else {
      Write-Output "Login {{ item }} already exists, skipping creation"
    }

    # Add to sysadmin if not a direct member of the role.
    $result2 = & $sqlcmd {{ connection_type }} -Q "IF NOT EXISTS (SELECT 1 FROM sys.server_role_members srm JOIN sys.server_principals r ON srm.role_principal_id = r.principal_id JOIN sys.server_principals m ON srm.member_principal_id = m.principal_id WHERE r.name = 'sysadmin' AND m.name = '{{ item }}') ALTER SERVER ROLE [sysadmin] ADD MEMBER [{{ item }}]" 2>&1
    if ($LASTEXITCODE -ne 0) {
      Write-Error "ALTER SERVER ROLE sysadmin ADD MEMBER failed: $result2"
      exit 1
    }
    Write-Output "Successfully configured sysadmin: {{ item }}"
  loop: "{{ sql_sysadmins }}"
  register: admin_result

- name: Log MSSQL admin errors
  ansible.builtin.debug:
    msg: "WARNING: MSSQL admin config had stderr: {{ item.stderr }}"
  loop: "{{ admin_result.results | default([]) }}"
  when: item.stderr is defined and item.stderr | length > 0
  loop_control:
    label: "{{ item.item | default('unknown') }}"

- name: Add IMPERSONATE on login
  ansible.windows.win_shell: |
    $ErrorActionPreference = "Continue"
    $sqlcmd = "{{ sqlcmd_exe }}"
    $errors = @()

    # Create login if not exists
    $result1 = & $sqlcmd {{ connection_type }} -Q "IF NOT EXISTS (SELECT * FROM sys.server_principals WHERE name = '{{ item.key }}') CREATE LOGIN [{{ item.key }}] FROM WINDOWS" 2>&1
    if ($LASTEXITCODE -ne 0) { $errors += "CREATE LOGIN failed: $result1" }

    # Grant impersonate permission
    $result2 = & $sqlcmd {{ connection_type }} -Q "GRANT IMPERSONATE ON LOGIN::[{{ item.value }}] TO [{{ item.key }}]" 2>&1
    if ($LASTEXITCODE -ne 0) { $errors += "GRANT IMPERSONATE failed: $result2" }

    if ($errors.Count -gt 0) {
      Write-Error ($errors -join "`n")
      exit 1
    }
    Write-Output "Successfully granted IMPERSONATE ON LOGIN::[{{ item.value }}] TO [{{ item.key }}]"
  with_dict: "{{ executeaslogin }}"
  register: impersonate_login_result

- name: Log IMPERSONATE login errors
  ansible.builtin.debug:
    msg: "WARNING: IMPERSONATE login config had stderr: {{ item.stderr }}"
  loop: "{{ impersonate_login_result.results | default([]) }}"
  when: item.stderr is defined and item.stderr | length > 0
  loop_control:
    label: "{{ item.item.key | default('unknown') }}"

- name: Add IMPERSONATE on user
  ansible.windows.win_shell: |
    $ErrorActionPreference = "Continue"
    $sqlcmd = "{{ sqlcmd_exe }}"
    $errors = @()

    # Create login if not exists
    $result1 = & $sqlcmd {{ connection_type }} -Q "IF NOT EXISTS (SELECT * FROM sys.server_principals WHERE name = '{{ item.value.user }}') CREATE LOGIN [{{ item.value.user }}] FROM WINDOWS" 2>&1
    if ($LASTEXITCODE -ne 0) { $errors += "CREATE LOGIN failed: $result1" }

    # Create user if not exists
    $result2 = & $sqlcmd {{ connection_type }} -Q "USE {{ item.value.db }};IF NOT EXISTS (SELECT * FROM sys.database_principals WHERE name = '{{ item.value.user }}') CREATE USER [{{ item.value.user }}] FOR LOGIN [{{ item.value.user }}]" 2>&1
    if ($LASTEXITCODE -ne 0) { $errors += "CREATE USER failed: $result2" }

    # Grant impersonate on user
    $result3 = & $sqlcmd {{ connection_type }} -Q "USE {{ item.value.db }};GRANT IMPERSONATE ON USER::[{{ item.value.impersonate }}] TO [{{ item.value.user }}]" 2>&1
    if ($LASTEXITCODE -ne 0) { $errors += "GRANT IMPERSONATE ON USER failed: $result3" }

    if ($errors.Count -gt 0) {
      Write-Error ($errors -join "`n")
      exit 1
    }
    Write-Output "Successfully granted IMPERSONATE ON USER::[{{ item.value.impersonate }}] TO [{{ item.value.user }}] in {{ item.value.db }}"
  with_dict: "{{ executeasuser }}"
  register: impersonate_user_result

- name: Log IMPERSONATE user errors
  ansible.builtin.debug:
    msg: "WARNING: IMPERSONATE user config had stderr: {{ item.stderr }}"
  loop: "{{ impersonate_user_result.results | default([]) }}"
  when: item.stderr is defined and item.stderr | length > 0
  loop_control:
    label: "{{ item.item.key | default('unknown') }}"

- name: Enable sa account
  ansible.windows.win_shell: |
    $ErrorActionPreference = "Continue"
    $sqlcmd = "{{ sqlcmd_exe }}"
    $errors = @()
    $saPassword = [Text.Encoding]::UTF8.GetString(
      [Convert]::FromBase64String("{{ sa_password | b64encode }}")
    )
    $saPasswordSql = $saPassword.Replace("'", "''")

    # Enable sa login
    $result1 = & $sqlcmd {{ connection_type }} -Q "ALTER LOGIN sa ENABLE" 2>&1
    if ($LASTEXITCODE -ne 0) { $errors += "ALTER LOGIN sa ENABLE failed: $result1" }

    # Set sa password
    $result2 = & $sqlcmd {{ connection_type }} -Q "ALTER LOGIN sa WITH PASSWORD = N'$saPasswordSql', CHECK_POLICY=OFF" 2>&1
    if ($LASTEXITCODE -ne 0) { $errors += "ALTER LOGIN sa WITH PASSWORD failed: $result2" }

    if ($errors.Count -gt 0) {
      Write-Error ($errors -join "`n")
      exit 1
    }
    Write-Output "Successfully enabled sa account"
  register: sa_result
  no_log: true

- name: Log sa account errors
  ansible.builtin.debug:
    msg: "WARNING: sa account config had stderr: {{ sa_result.stderr }}"
  when: sa_result.stderr is defined and sa_result.stderr | length > 0

- name: Enable MSSQL authentication and windows authent
  ansible.windows.win_shell: |
    $sqlcmd = "{{ sqlcmd_exe }}"
    $result = & $sqlcmd {{ connection_type }} -Q "EXEC xp_instance_regwrite N'HKEY_LOCAL_MACHINE', N'Software\Microsoft\MSSQLServer\MSSQLServer', N'LoginMode', REG_DWORD, 2" 2>&1
    if ($LASTEXITCODE -ne 0) {
      Write-Error "Failed to enable mixed mode auth: $result"
      exit 1
    }
    Write-Output "Successfully enabled mixed mode authentication (LoginMode=2)"
  register: auth_mode_result

- name: Enable xp_cmdshell
  ansible.windows.win_shell: |
    $ErrorActionPreference = "Continue"
    $sqlcmd = "{{ sqlcmd_exe }}"
    $errors = @()

    $result1 = & $sqlcmd {{ connection_type }} -Q "EXEC sp_configure 'show advanced options', 1; RECONFIGURE" 2>&1
    if ($LASTEXITCODE -ne 0) { $errors += "show advanced options failed: $result1" }

    $result2 = & $sqlcmd {{ connection_type }} -Q "EXEC sp_configure 'xp_cmdshell', 1; RECONFIGURE" 2>&1
    if ($LASTEXITCODE -ne 0) { $errors += "xp_cmdshell enable failed: $result2" }

    if ($errors.Count -gt 0) {
      Write-Error ($errors -join "`n")
      exit 1
    }
    Write-Output "Successfully enabled xp_cmdshell"
  register: xp_cmdshell_result

- name: Log xp_cmdshell errors
  ansible.builtin.debug:
    msg: "WARNING: xp_cmdshell config had stderr: {{ xp_cmdshell_result.stderr }}"
  when: xp_cmdshell_result.stderr is defined and xp_cmdshell_result.stderr | length > 0

- name: Restart service MSSQL
  ansible.windows.win_service:
    name: "{{ mssql_service_name }}"
    force_dependent_services: true
    state: restarted
  when: auth_mode_result.changed or (sa_result.changed | default(false))
