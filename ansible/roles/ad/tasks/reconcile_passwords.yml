---
# Passwords are only ever set on user CREATE, so any password an attack run
# changed stays changed across a reset. Detect that by actually authenticating
# with the configured password and resetting only the accounts that fail.

- name: Confirm the credential probe rejects invalid credentials
  ansible.windows.win_powershell:
    script: |
      $ProgressPreference = 'SilentlyContinue'

      if (-not ('DgLogon' -as [type])) {
        Add-Type -TypeDefinition @'
      using System;
      using System.Runtime.InteropServices;
      public static class DgLogon {
          [DllImport("advapi32.dll", SetLastError = true, CharSet = CharSet.Unicode)]
          public static extern bool LogonUser(string user, string domain, string password,
              int logonType, int logonProvider, out IntPtr token);
          [DllImport("kernel32.dll", SetLastError = true)]
          public static extern bool CloseHandle(IntPtr handle);
      }
      '@
      }

      # A bogus principal must fail to authenticate. Running as SYSTEM on a DC,
      # some credential-check APIs (notably DirectoryEntry) return success for
      # any password, which would silently turn this whole role into a no-op.
      # Use a name that cannot exist rather than a real account with a wrong
      # password, so the control never burns a lockout attempt on a real user.
      $token = [IntPtr]::Zero
      $bogus = "dgprobe-" + [guid]::NewGuid().ToString("N")
      $ok = [DgLogon]::LogonUser($bogus, "{{ domain }}", [guid]::NewGuid().ToString(), 3, 0, [ref]$token)
      if ($ok -and $token -ne [IntPtr]::Zero) { [void][DgLogon]::CloseHandle($token) }

      if ($ok) {
        throw "credential probe authenticated a nonexistent principal; password drift cannot be detected on this host"
      }

      Write-Output "credential probe rejects invalid credentials"
      $Ansible.Changed = $false
  changed_when: false

- name: Reconcile user passwords against the lab config
  ansible.windows.win_powershell:
    script: |
      [CmdletBinding()]
      param (
        [string]$Username,
        [string]$Password,
        [string]$Domain,
        [bool]$CheckOnly
      )

      $ProgressPreference = 'SilentlyContinue'

      if (-not ('DgLogon' -as [type])) {
        Add-Type -TypeDefinition @'
      using System;
      using System.Runtime.InteropServices;
      public static class DgLogon {
          [DllImport("advapi32.dll", SetLastError = true, CharSet = CharSet.Unicode)]
          public static extern bool LogonUser(string user, string domain, string password,
              int logonType, int logonProvider, out IntPtr token);
          [DllImport("kernel32.dll", SetLastError = true)]
          public static extern bool CloseHandle(IntPtr handle);
      }
      '@
      }

      function Test-DgPassword {
        param([string]$User, [string]$Dom, [string]$Pass)
        $token = [IntPtr]::Zero
        # 3 = LOGON32_LOGON_NETWORK, 0 = LOGON32_PROVIDER_DEFAULT
        $ok = [DgLogon]::LogonUser($User, $Dom, $Pass, 3, 0, [ref]$token)
        if ($ok -and $token -ne [IntPtr]::Zero) { [void][DgLogon]::CloseHandle($token) }
        return $ok
      }

      $changed = $false

      try {
        $user = Get-ADUser -Identity $Username -Properties LockedOut, memberOf -ErrorAction Stop
      } catch {
        Write-Warning ("Skipping " + $Username + " - " + $_.Exception.Message)
        $Ansible.Changed = $false
        return
      }

      # A locked account fails the probe no matter what its password is, which
      # would make this task reset the password on every run until the lockout
      # expires. Clear the lockout first so the probe result is meaningful.
      if ($user.LockedOut) {
        if ($CheckOnly) {
          Write-Output ("DRIFT " + $Username + " is locked out")
        } else {
          Unlock-ADAccount -Identity $Username -ErrorAction Stop
          Write-Output ("UNLOCKED " + $Username)
          $changed = $true
        }
      }

      # Protected Users members cannot do NTLM network logon, so the probe
      # always fails for them and we would reset their password every run.
      $protectedSid = (Get-ADDomain).DomainSID.Value + "-525"
      $isProtected = $false
      foreach ($dn in @($user.memberOf)) {
        try {
          if ((Get-ADGroup -Identity $dn -ErrorAction Stop).SID.Value -eq $protectedSid) {
            $isProtected = $true
            break
          }
        } catch { }
      }

      if ($isProtected) {
        Write-Warning ($Username + " is in Protected Users - password drift is not checked for this account")
        $Ansible.Changed = $changed
        return
      }

      if (Test-DgPassword -User $Username -Dom $Domain -Pass $Password) {
        Write-Output ($Username + " password matches lab config")
      } elseif ($CheckOnly) {
        Write-Output ("DRIFT " + $Username + " password does not match lab config")
      } else {
        $securePassword = ConvertTo-SecureString -String $Password -AsPlainText -Force
        Set-ADAccountPassword -Identity $Username -Reset -NewPassword $securePassword -ErrorAction Stop
        Write-Output ("RESET " + $Username + " password had drifted")
        $changed = $true
      }

      $Ansible.Changed = $changed
    parameters:
      Username: "{{ item.key }}"
      Password: "{{ item.value.password }}"
      Domain: "{{ domain }}"
      CheckOnly: "{{ ad_reconcile_check_only }}"
  with_dict: "{{ ad_users }}"
  loop_control:
    label: "Reconciling password for user: {{ item.key }}"
  register: password_reconcile
  no_log: true

# The task above is no_log because it takes cleartext passwords as parameters,
# which also hides which accounts drifted. The script's own output carries no
# secrets, so replay just that.
- name: Report password drift
  ansible.builtin.debug:
    msg: "{{ password_reconcile.results | map(attribute='output') | select('defined') | flatten | select('search', '^(RESET|DRIFT|UNLOCKED) ') | list }}"
  when: password_reconcile is defined and password_reconcile.results is defined
