---
- name: Restart Samba
  ansible.builtin.service:
    name: smbd
    state: restarted

- name: Reload NFS exports
  ansible.builtin.command: exportfs -ra

- name: Restart rsync
  ansible.builtin.service:
    name: rsync
    state: restarted

- name: Reload SSH listeners
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      /usr/sbin/sshd -t
      mapfile -t listeners < <(
        pgrep -f '^sshd: /usr/sbin/sshd -D \[listener\]' || true
      )
      if (( ${#listeners[@]} == 0 )); then
        systemctl restart ssh.service
      else
        kill -HUP "${listeners[@]}"
      fi
    executable: /bin/bash
  changed_when: true
