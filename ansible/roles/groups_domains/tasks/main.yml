---
- name: Record pre-reboot boot time baseline
  ansible.windows.win_powershell:
    script: |
      (Get-CimInstance -ClassName Win32_OperatingSystem -Property LastBootUpTime).LastBootUpTime.ToFileTime()
  register: reboot_baseline

- name: Reboot and wait for the AD system to restart
  block:
    - name: Trigger reboot via win_reboot
      ansible.windows.win_reboot:
        test_command: "Get-ADUser -Identity Administrator -Properties *"
        reboot_timeout: 300
        post_reboot_delay: 60
  rescue:
    - name: Verify reboot completed (aws_ssm reconnect timeout is expected)
      ansible.windows.win_powershell:
        script: |
          $current = (Get-CimInstance -ClassName Win32_OperatingSystem -Property LastBootUpTime).LastBootUpTime.ToFileTime()
          if ($current -le {{ reboot_baseline.output[0] }}) { throw "host has not rebooted yet" }
          Get-ADUser -Identity Administrator -Properties * | Out-Null
      register: reboot_verify
      until: reboot_verify is succeeded
      retries: 30
      delay: 10

- name: Synchronize all domains with proper credentials
  ansible.windows.win_powershell:
    parameters:
      DomainUsername: "{{ domain_username }}"
      DomainPassword: "{{ domain_password }}"
    script: |
      [CmdletBinding()]
      param (
        [Parameter(Mandatory)][string]$DomainUsername,
        [Parameter(Mandatory)][string]$DomainPassword
      )

      # Create credentials for domain admin
      $adminPassword = ConvertTo-SecureString $DomainPassword -AsPlainText -Force
      $adminCred = New-Object System.Management.Automation.PSCredential($DomainUsername, $adminPassword)

      # Create script block to run with elevated privileges
      $scriptBlock = {
        # Try using repadmin with the Domain Admin privileges
        try {
          $output = repadmin /syncall /APeD 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "repadmin exited with code ${LASTEXITCODE}: $output"
          }
          Write-Output "Replication initiated with repadmin: $output"
          return $true
        } catch {
          $errorMsg = $_.Exception.Message
          Write-Output "Error with repadmin: $errorMsg"

          # Alternative method using PowerShell AD cmdlets
          try {
            Import-Module ActiveDirectory
            $domainControllers = Get-ADDomainController -Filter *

            foreach ($dc in $domainControllers) {
              Write-Output "Synchronizing DC: $($dc.HostName)"
              $result = Sync-ADObject -Server $dc.HostName -Object (Get-ADDomain).DistinguishedName -Scope Subtree
              Write-Output "Sync result: $result"
            }

            return $true
          } catch {
            $errorMsg = $_.Exception.Message
            Write-Output "Error with AD sync: $errorMsg"
            return $false
          }
        }
      }

      # Execute with credentials
      $result = Invoke-Command -ScriptBlock $scriptBlock -Credential $adminCred -ComputerName localhost

      return $result
    error_action: stop
  register: sync_result
  failed_when: >-
    (sync_result.error | default([]) | length > 0) or
    (sync_result.output | default([]) | length == 0) or
    (
      sync_result.output | default([]) | length > 0 and
      (sync_result.output | last) == false
    )
  until: sync_result is succeeded
  retries: 3
  delay: 30
  vars:
    ansible_become: false

# The Netlogon secure channel that backs cross-domain LDAP auth takes
# measurably longer to establish than the trust object itself — on Azure
# with WinRM/PSRP over Bastion it can exceed 3+ minutes after reboot.
# Poll nltest until every peer domain's channel is healthy before
# attempting the cross-domain group membership adds.
- name: Wait for trust secure channel to peer domains
  ansible.windows.win_powershell:
    script: |
      [CmdletBinding()] param()
      $peers = @(
        {% for members in domain_groups_members.values() %}
        {% for m in members %}
        "{{ m.split('\\')[0] }}"{% if not loop.last %},{% endif %}
        {% endfor %}{% if not loop.last %},{% endif %}
        {% endfor %}
      ) | Sort-Object -Unique

      foreach ($domain in $peers) {
        $out = nltest /sc_query:$domain 2>&1
        if ($LASTEXITCODE -ne 0) {
          throw "Secure channel to $domain not ready (nltest exit $LASTEXITCODE): $out"
        }
        Write-Output "Secure channel to $domain: OK"
      }
  register: trust_channel_check
  until: trust_channel_check is succeeded
  retries: 30
  delay: 20
  when: domain_groups_members is defined and domain_groups_members | length > 0

- name: Add cross-domain users/groups using PowerShell Direct
  ansible.windows.win_powershell:
    parameters:
      DomainServer: "{{ domain_server }}"
      DomainUsername: "{{ domain_username }}"
      DomainPassword: "{{ domain_password }}"
    script: |
      [CmdletBinding()]
      param (
        [Parameter(Mandatory)][string]$DomainServer,
        [Parameter(Mandatory)][string]$DomainUsername,
        [Parameter(Mandatory)][string]$DomainPassword
      )

      $domainPasswordSecure = ConvertTo-SecureString $DomainPassword -AsPlainText -Force
      $domainCred = New-Object System.Management.Automation.PSCredential($DomainUsername, $domainPasswordSecure)

      # Convert dictionary to PowerShell object
      $groupMemberships = @{
        {% for group_name, members in domain_groups_members.items() %}
        "{{ group_name }}" = @(
          {% for member in members %}
          "{{ member }}"{% if not loop.last %},{% endif %}
          {% endfor %}
        ){% if not loop.last %};{% endif %}
        {% endfor %}
      }

      $scriptBlock = {
        param($groupMemberships, $domainServer)

        Import-Module ActiveDirectory
        $results = @{}

        foreach ($groupName in $groupMemberships.Keys) {
          $groupResult = @{
            "name" = $groupName
            "members_added" = @()
            "members_failed" = @()
            "success" = $true
          }

          try {
            # Get the group
            $group = Get-ADGroup -Identity $groupName -Server $domainServer -ErrorAction Stop
            Write-Output "Processing group: $groupName"

            foreach ($member in $groupMemberships[$groupName]) {
              try {
                # Parse the domain and username/group
                if ($member -match "(.+)\\(.+)") {
                  $memberDomain = $matches[1]
                  $memberName = $matches[2]

                  # First, try to get the member as a user
                  try {
                    Write-Output "Looking up user: $memberName in domain $memberDomain"
                    # Try to get the member directly from its domain
                    $adObject = Get-ADUser -Identity $memberName -Server "$memberDomain" -ErrorAction Stop
                    Write-Output "Found as user: $($adObject.DistinguishedName)"
                  } catch {
                    $errorMsg = $_.Exception.Message
                    # If not a user, try as a group
                    try {
                      Write-Output "Looking up group: $memberName in domain $memberDomain"
                      $adObject = Get-ADGroup -Identity $memberName -Server "$memberDomain" -ErrorAction Stop
                      Write-Output "Found as group: $($adObject.DistinguishedName)"
                    } catch {
                      $errorMsg = $_.Exception.Message
                      throw "Could not find $member as either a user or group. Error: $errorMsg"
                    }
                  }

                  # Add the member to the group
                  Add-ADGroupMember -Identity $group -Members $adObject -Server $domainServer -ErrorAction Stop
                  Write-Output "Successfully added $member to group $groupName"
                  $groupResult.members_added += $member
                } else {
                  throw "Invalid member format. Expected 'domain\\username' but got '$member'"
                }
              } catch {
                $errorMsg = $_.Exception.Message
                Write-Output "Error adding $member to $groupName. Error: $errorMsg"
                $groupResult.members_failed += "$member (Error: $errorMsg)"
                $groupResult.success = $false
              }
            }
          } catch {
            $errorMsg = $_.Exception.Message
            Write-Output "Error processing group $groupName. Error: $errorMsg"
            $groupResult.success = $false
          }

          $results[$groupName] = $groupResult
        }

        return $results | ConvertTo-Json -Depth 5
      }

      $scriptOutput = @(Invoke-Command -ScriptBlock $scriptBlock -ArgumentList $groupMemberships, $DomainServer -Credential $domainCred -ComputerName localhost)

      try {
        if ($scriptOutput.Count -eq 0) {
          throw "Cross-domain membership script returned no result payload"
        }

        if ($scriptOutput.Count -gt 1) {
          $scriptOutput[0..($scriptOutput.Count - 2)] | ForEach-Object { Write-Output $_ }
        }

        $jsonPayload = $scriptOutput[-1]
        $resultsObj = $jsonPayload | ConvertFrom-Json -ErrorAction Stop

        # Check if any group failed
        $success = $true
        foreach ($groupName in $resultsObj.PSObject.Properties.Name) {
          $groupResult = $resultsObj.$groupName
          if (-not $groupResult.success) {
            $success = $false
            Write-Output "Failed to add some or all members to group $groupName"
            foreach ($failedMember in $groupResult.members_failed) {
              Write-Output "  - Failed to add: $failedMember"
            }
          } else {
            Write-Output "Successfully added all members to group $groupName"
            foreach ($addedMember in $groupResult.members_added) {
              Write-Output "  - Added: $addedMember"
            }
          }
        }

        $Ansible.Changed = $success
        $Ansible.Result = $resultsObj
        if (-not $success) {
          $Ansible.Failed = $true
        }
      } catch {
        $errorMsg = $_.Exception.Message
        Write-Output "Error processing results: $errorMsg"
        Write-Output "Raw results: $scriptOutput"
        $Ansible.Changed = $false
        $Ansible.Failed = $true
        $Ansible.Result = @{
          error = $errorMsg
          raw_results = $scriptOutput
        }
      }
    error_action: stop
  register: cross_domain_result
  until: cross_domain_result is succeeded
  retries: 5
  delay: 60
  when: domain_groups_members is defined and domain_groups_members | length > 0
